  const el=build(id),old=cur,d=dur(tr);cur=el;curId=id;
  if(d&&old){el.style.opacity=0;phone.appendChild(el);el.getBoundingClientRect();el.style.transition=`opacity ${d}ms ease`;el.style.opacity=1;
    setTimeout(()=>old.remove(),d+30)}else{phone.appendChild(el);old&&old.remove()}
  S[id][3].filter(l=>l[1]!=='c').forEach(l=>timers.push(setTimeout(()=>go(l[0],l[6],true),l[1]+d)));
  document.getElementById('back').disabled=!hist.length}
document.getElementById('restart').onclick=()=>{hist=[];go(START,'D300',false)};
document.getElementById('back').onclick=()=>{if(hist.length)go(hist.pop(),'D200',false)};
document.getElementById('hints').onclick=()=>showSteps(1800);
go(START,'I',false);
</script>

</body></html>
